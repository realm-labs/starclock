[package]
name = "starclock-agent-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[[example]]
name = "agent_benchmark"
path = "examples/agent_benchmark.rs"
required-features = ["benchmark-harness"]

[[example]]
name = "universe_benchmark"
path = "examples/universe_benchmark.rs"
required-features = ["benchmark-harness"]

[[example]]
name = "dynamic_assembly_benchmark"
path = "examples/dynamic_assembly_benchmark.rs"
required-features = ["benchmark-harness"]

[[example]]
name = "gold_gears_benchmark"
path = "examples/gold_gears_benchmark.rs"
required-features = ["benchmark-harness"]

[[example]]
name = "swarm_disaster_benchmark"
path = "examples/swarm_disaster_benchmark.rs"
required-features = ["benchmark-harness"]

[features]
benchmark-harness = ["starclock-mode-universe/benchmark-harness"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
starclock-ai = { path = "../starclock-ai" }
starclock-activity = { path = "../starclock-activity" }
starclock-combat = { path = "../starclock-combat" }
starclock-data = { path = "../starclock-data" }
starclock-mode-universe = { path = "../starclock-mode-universe" }
starclock-replay = { path = "../starclock-replay" }

[dev-dependencies]
allocation-counter.workspace = true
proptest.workspace = true
