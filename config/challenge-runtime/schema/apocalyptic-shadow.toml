[[tables]]
name = "ApsRuntimeProfiles"
mode = "map"
key = "id"
[tables.source]
format = "xlsx"
file = "ApocalypticShadowRuntime.xlsx"
sheet = "Profiles"
[[tables.fields]]
name = "id"
type = "i32"
range = [1, 2147483647]
[[tables.fields]]
name = "stable_key"
type = "string"
length = [1, 128]
[[tables.fields]]
name = "game_version"
type = "string"
length = [1, 32]
[[tables.fields]]
name = "initial_action_value_scaled"
type = "i64"
range = [1, 9223372036854775807]
[[tables.fields]]
name = "expiry"
type = "enum<ChallengeClockExpiry>"
[[tables.fields]]
name = "boss_progress_maximum"
type = "i32"
range = [1, 100000]
[[tables.fields]]
name = "action_value_score_maximum"
type = "i32"
range = [1, 100000]
[[tables.fields]]
name = "source_ref"
type = "string"
length = [1, 4096]
[[tables.indexes]]
name = "by_stable_key"
fields = ["stable_key"]
unique = true

