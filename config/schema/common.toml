[[tables]]
id = "source-record"
name = "SourceRecord"
mode = "map"
key = "id"

[tables.source]
format = "xlsx"
file = "SourceRecord.xlsx"

[[tables.fields]]
name = "id"
type = "i32"
range = [1, 2147483647]

[[tables.fields]]
name = "stable_key"
type = "string"
length = [1, 160]

[[tables.fields]]
name = "publisher"
type = "string"
length = [1, 200]

[[tables.fields]]
name = "url"
type = "string"
length = [1, 2048]

[[tables.fields]]
name = "accessed_on"
type = "string"
length = [10, 10]

[[tables.fields]]
name = "applicable_game_version"
type = "string"
length = [1, 32]

[[tables.fields]]
name = "category"
type = "enum<SourceCategory>"

[[tables.fields]]
name = "confidence"
type = "enum<Confidence>"

[[tables.fields]]
name = "usage_note"
type = "string"
length = [1, 1000]

[[tables.fields]]
name = "evidence_sha256"
type = "string"
length = [64, 64]

[[tables.fields]]
name = "conflict_note"
type = "optional<string>"

[[tables.indexes]]
name = "by_stable_key"
fields = ["stable_key"]
unique = true

[[tables]]
id = "evidence-record"
name = "EvidenceRecord"
mode = "map"
key = "id"

[tables.source]
format = "xlsx"
file = "EvidenceRecord.xlsx"

[[tables.fields]]
name = "id"
type = "i32"
range = [1, 2147483647]

[[tables.fields]]
name = "stable_key"
type = "string"
length = [1, 160]

[[tables.fields]]
name = "kind"
type = "enum<EvidenceKind>"

[[tables.fields]]
name = "source_record_id"
type = "optional<ref<SourceRecord.id>>"

[[tables.fields]]
name = "sha256"
type = "string"
length = [64, 64]

[[tables.fields]]
name = "note"
type = "string"
length = [1, 1000]

[[tables.indexes]]
name = "by_stable_key"
fields = ["stable_key"]
unique = true

