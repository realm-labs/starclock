[[enums]]
name = "EffectStackPolicy"
values = [{ id = 0, name = "Replace" }, { id = 1, name = "Refresh" }, { id = 2, name = "RefreshAndAddStacks" }, { id = 3, name = "StrongestWins" }, { id = 4, name = "IndependentBySource" }, { id = 5, name = "IndependentInstances" }, { id = 6, name = "UniqueGlobal" }, { id = 7, name = "UniquePerSource" }]

[[enums]]
name = "DurationClock"
values = [{ id = 0, name = "Permanent" }, { id = 1, name = "OwnerTurnStart" }, { id = 2, name = "OwnerTurnEnd" }, { id = 3, name = "TargetTurnStart" }, { id = 4, name = "TargetTurnEnd" }, { id = 5, name = "ActionEnd" }, { id = 6, name = "WaveEnd" }, { id = 7, name = "BattleEnd" }]

[[enums]]
name = "EffectTickPhase"
values = [{ id = 0, name = "None" }, { id = 1, name = "TurnStart" }, { id = 2, name = "TurnEnd" }, { id = 3, name = "ActionStart" }, { id = 4, name = "ActionEnd" }, { id = 5, name = "AfterEvent" }]

[[enums]]
name = "EffectTeardownPolicy"
values = [{ id = 0, name = "RemoveWithOwner" }, { id = 1, name = "TransferToTeam" }, { id = 2, name = "FreezeSnapshot" }, { id = 3, name = "PersistByScope" }, { id = 4, name = "ExplicitRule" }]
[[tables]]
id = "effect"
name = "Effect"
mode = "map"
key = "id"

[tables.source]
format = "xlsx"
file = "Effect.xlsx"

[[tables.fields]]
name = "id"
type = "ref<ContentIdentity.id>"

[[tables.fields]]
name = "category"
type = "enum<EffectCategory>"

[[tables.fields]]
name = "dispel_category"
type = "enum<DispelCategory>"

[[tables.fields]]
name = "stack_limit"
type = "i32"
range = [1, 1000]

[[tables.fields]]
name = "duration_expression_id"
type = "optional<ref<ValueExpression.id>>"

[[tables.fields]]
name = "duration_clock"
type = "enum<DurationClock>"

[[tables.fields]]
name = "tick_phase"
type = "enum<EffectTickPhase>"

[[tables.fields]]
name = "stack_policy"
type = "enum<EffectStackPolicy>"

[[tables.fields]]
name = "magnitude_comparator_expression_id"
type = "optional<ref<ValueExpression.id>>"

[[tables.fields]]
name = "dot_element"
type = "optional<enum<CombatElement>>"

[[tables.fields]]
name = "detonation_tag_identity_id"
type = "optional<ref<ContentIdentity.id>>"

[[tables.fields]]
name = "snapshot_policy"
type = "enum<SnapshotPolicy>"

[[tables.fields]]
name = "teardown_policy"
type = "enum<EffectTeardownPolicy>"

[[tables.fields]]
name = "application_priority"
type = "i32"
range = [-1000000, 1000000]

[[tables]]
id = "effect-tag"
name = "EffectTag"
mode = "list"

[tables.source]
format = "xlsx"
file = "EffectTag.xlsx"

[[tables.fields]]
name = "effect_id"
type = "ref<Effect.id>"

[[tables.fields]]
name = "sequence"
type = "i32"
range = [1, 100]

[[tables.fields]]
name = "tag"
type = "string"
length = [1, 120]

[[tables.indexes]]
name = "by_effect_sequence"
fields = ["effect_id", "sequence"]
unique = true

[[tables.indexes]]
name = "by_effect_tag"
fields = ["effect_id", "tag"]
unique = true

