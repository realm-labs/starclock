[[tables]]
id = "ability"
name = "Ability"
mode = "map"
key = "id"

[tables.source]
format = "xlsx"
file = "Ability.xlsx"

[[tables.fields]]
name = "id"
type = "ref<ContentIdentity.id>"

[[tables.fields]]
name = "kind"
type = "enum<AbilityKind>"

[[tables.fields]]
name = "target_pattern"
type = "enum<TargetPattern>"

[[tables.fields]]
name = "retarget_policy"
type = "enum<RetargetPolicy>"

[[tables.fields]]
name = "level_cap"
type = "i32"
range = [1, 30]

[[tables.fields]]
name = "cooldown_actions"
type = "i32"
range = [0, 100]

[[tables.fields]]
name = "semantic_tags_mask"
type = "i32"
range = [0, 4095]

[[tables.fields]]
name = "entry_rule_identity_id"
type = "optional<ref<ContentIdentity.id>>"

