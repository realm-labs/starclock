
[[enums]]
name = "AiCandidateSelection"
values = [{ id = 0, name = "FirstLegal" }, { id = 1, name = "WeightedDraw" }]

[[enums]]
name = "AiNoTargetFallback"
values = [{ id = 0, name = "UseFallbackAbility" }, { id = 1, name = "StayInState" }, { id = 2, name = "Transition" }, { id = 3, name = "SkipAction" }, { id = 4, name = "Fault" }]

[[enums]]
name = "AiTransitionTiming"
values = [{ id = 0, name = "AutomaticBeforeDecision" }, { id = 1, name = "AfterAction" }, { id = 2, name = "AfterPhase" }, { id = 3, name = "Explicit" }]
[[tables]]
id = "ai-graph"
name = "AiGraph"
mode = "map"
key = "id"

[tables.source]
format = "xlsx"
file = "AiGraph.xlsx"

[[tables.fields]]
name = "id"
type = "ref<ContentIdentity.id>"

[[tables.fields]]
name = "initial_state_id"
type = "ref<AiState.id>"

[[tables.fields]]
name = "automatic_transition_budget"
type = "i32"
range = [1, 100]

[[tables]]
id = "ai-state"
name = "AiState"
mode = "map"
key = "id"

[tables.source]
format = "xlsx"
file = "AiState.xlsx"

[[tables.fields]]
name = "id"
type = "i32"
range = [1, 2147483647]

[[tables.fields]]
name = "stable_key"
type = "string"
length = [1, 160]

[[tables.fields]]
name = "graph_id"
type = "ref<AiGraph.id>"

[[tables.fields]]
name = "entry_program_id"
type = "optional<ref<Program.id>>"

[[tables.fields]]
name = "mandatory_fallback_ability_id"
type = "ref<EnemyAbility.id>"

[[tables.fields]]
name = "turn_counter_reset"
type = "bool"

[[tables.indexes]]
name = "by_stable_key"
fields = ["stable_key"]
unique = true

