[[tables]]
id = "character"
name = "Character"
mode = "map"
key = "id"

[tables.source]
format = "xlsx"
file = "Character.xlsx"

[[tables.fields]]
name = "id"
type = "ref<ContentIdentity.id>"

[[tables.fields]]
name = "source_avatar_id"
type = "i32"
range = [1, 2147483647]

[[tables.fields]]
name = "rarity"
type = "i32"
range = [4, 5]

[[tables.fields]]
name = "path"
type = "enum<CombatPath>"

[[tables.fields]]
name = "element"
type = "enum<CombatElement>"

[[tables.fields]]
name = "base_energy_decimal"
type = "string"
length = [1, 32]

[[tables.fields]]
name = "base_aggro_decimal"
type = "string"
length = [1, 32]

