project = { id = "starclock_common_schema_fixture" }
groups = { common = { default = true } }
views = { default = { contract = "starclock_common_schema_fixture/default", groups = ["common"] } }
includes = ["../../schema/common.toml", "schema/fixture.toml"]

[build]
data_root = "data"
view = "default"
schema_lock = "generated/schema.lock"

[[build.codegen]]
target = "rust"
out = "generated/rust"
format = "never"

[[build.exports]]
format = "binary"
out = "generated/config.sora"

[[build.exports]]
format = "json-debug"
out = "generated/debug-json"

[codegen.rust]
runtime_format = "sora"
